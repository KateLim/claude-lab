<!doctype html>
<html lang="ko" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미래를 위한 배당 설계기</title>
<meta name="description" content="목표 금액을 몰라도 괜찮습니다. 나이와 소득만으로 미래 배당 목표를 역산하고 포트폴리오를 설계합니다.">
<!-- 한글·라틴 자폭이 고르고 숫자 표에 강한 Pretendard, 숫자 전용으로 IBM Plex Mono.
     둘 다 못 받아도 아래 시스템 폰트 스택으로 그대로 읽힌다 (styles.css의 --sans/--mono). -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23181c2e'/%3E%3Cpath d='M8 21h4v3H8zM14 15h4v9h-4zM20 9h4v15h-4z' fill='%23a2712c'/%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./" data-link><b>배당 설계기</b><span>local build</span></a>
    <div class="spacer"></div>
    <span class="eyebrow freshness" id="asof"></span>
    <button class="icon-btn" id="refresh" title="시장 데이터 새로 받기" aria-label="시장 데이터 새로 받기">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 4v5h-5"/>
      </svg>
    </button>
    <button class="icon-btn" id="theme" title="테마 전환" aria-label="테마 전환"></button>
  </div>
</header>
<main id="app"><div class="center"><div class="spin"></div><div>불러오는 중…</div></div></main>
<!-- 상대 경로를 쓴다. code-server 의 /proxy/<포트>/ 처럼 경로 접두어가 붙은
     환경에서도 그대로 열리게 하기 위한 것이다 (라우트는 한 칸 깊이만 쓴다). -->
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
